[project]
name = "enterprise-ai-platform-backend"
version = "0.1.0"
description = "Backend foundation for the Enterprise AI Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.112,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "argon2-cffi>=23.1,<24.0",
    "PyJWT>=2.9,<3.0",
    "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
